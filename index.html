<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BabyBuddy - Modo Dormir</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .game-container {
            width: 430px; height: 850px; background: #ffb7d5; position: relative;
            overflow: hidden; border: 8px solid #fff; border-radius: 40px;
            transition: background 0.5s;
        }

        /* MODO NOCHE: Se activa con la clase 'dark' */
        .game-container.dark { background: #1a1a2e; }
        .game-container.dark #bedroom { opacity: 0.6; }

        .room { width: 100%; height: 100%; position: absolute; }
        #bedroom { background: url('cuarto_varon.jpg') center/cover; transition: opacity 0.5s; }

        /* NAVEGACIÓN */
        .sidebar { position: absolute; left: 15px; top: 150px; z-index: 10; display: flex; flex-direction: column; gap: 20px; }
        .nav-btn {
            width: 65px; height: 65px; background: white; border-radius: 20px;
            display: flex; justify-content: center; align-items: center; font-size: 30px;
            cursor: pointer; border: 3px solid #ff3385;
        }

        /* BEBÉ Y ANIMACIÓN */
        .baby-container {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            transition: all 0.5s;
        }
        .baby-img { width: 200px; transition: transform 0.5s; }

        /* MODO DORMIR: El bebé se acuesta */
        .sleeping { transform: translateX(-50%) translateY(50px) rotate(90deg); opacity: 0.8; }

        /* INTERRUPTOR DE LUZ */
        .light-switch {
            position: absolute; top: 40px; right: 40px; font-size: 40px; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-box">
        <div class="light-switch" onclick="toggleLight()">💡</div>

        <div id="bedroom" class="room">
            <div class="sidebar">
                <div class="nav-btn">🏠</div>
                <div class="nav-btn">🍎</div>
                <div class="nav-btn">🛁</div>
            </div>

            <div class="baby-container" id="baby">
                <img src="bebe_varon.png" class="baby-img">
            </div>
        </div>
    </div>

    <script>
        function toggleLight() {
            const container = document.getElementById('game-box');
            const baby = document.getElementById('baby');
            
            container.classList.toggle('dark');
            baby.classList.toggle('sleeping');
            
            // Si el bebé está durmiendo, podrías cambiar el src de la imagen 
            // a una donde tenga los ojos cerrados si tenés ese archivo
        }
    </script>
</body>
</html>
