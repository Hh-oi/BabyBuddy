<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyBuddy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: #ffb7d5; /* El rosa pastel tierno que elegiste */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor con aspecto de pantalla de celular */
        .game-container {
            width: 100%;
            max-width: 430px;
            height: 90vh;
            max-height: 850px;
            background: #fff0f5;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 8px solid #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
        }

        /* Marcador de Monedas pro */
        .stats-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 8px 0 #e6ccd3;
            font-size: 22px;
            font-weight: bold;
            color: #d63384;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Barra de Estado (Hambre) */
        .status-box {
            width: 80%;
            text-align: center;
        }
        .status-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .bar-container {
            width: 100%;
            background: #eee;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d94, #ff80b3);
            transition: width 0.3s ease;
        }

        /* Zona de los bebés */
        .baby-stage {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin: 20px 0;
        }

        .baby-card {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 0 #f0d5de;
            border: 2px solid #ffecf2;
            transition: transform 0.2s;
        }

        .baby-card:hover {
            transform: scale(1.05);
        }

        .baby-card img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 10px;
        }

        .baby-name {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        /* Botón de acción estilo Talking Tom */
        .action-btn {
            background: linear-gradient(180deg, #ff66a3 0%, #ff3385 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b30047, 0 15px 20px rgba(255, 51, 133, 0.4);
            transition: all 0.1s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b30047, 0 8px 10px rgba(255, 51, 133, 0.4);
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="stats-panel">
            🪙 <span id="coin-txt">Monedas: 0</span>
        </div>

        <div class="status-box">
            <div class="status-label">🍼 NIVEL DE SACIEDAD</div>
            <div class="bar-container">
                <div id="hunger-bar" class="bar-fill"></div>
            </div>
        </div>

        <div class="baby-stage">
            <div class="baby-card">
                <img src="bebe_varon.jpeg" alt="Bebé Varón" onerror="this.src='https://placehold.co/110x110/ffccd5/fff?text=Bebe+Varon'">
                <div class="baby-name">Bebe Varon</div>
            </div>
            <div class="baby-card">
                <img src="bebe_nena.jpeg" alt="Bebé Nena" onerror="this.src='https://placehold.co/110x110/ffccd5/fff?text=Bebe+Nena'">
                <div class="baby-name">Bebe Nena</div>
            </div>
        </div>

        <button class="action-btn" onclick="feedBabies()">DAR BIBERÓN</button>

    </div>

    <script>
        let coins = 0;
        let hunger = 100;

        const coinTxt = document.getElementById('coin-txt');
        const hungerBar = document.getElementById('hunger-bar');

        // Bucle para bajar el hambre de forma fluida
        setInterval(() => {
            if (hunger > 0) {
                hunger -= 0.5;
                hungerBar.style.width = hunger + '%';
            }
        }, 200);

        function feedBabies() {
            hunger = 100;
            coins += 10;
            hungerBar.style.width = hunger + '%';
            coinTxt.innerText = "Monedas: " + coins;
        }
    </script>
</body>
</html>
