<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BabyBuddy - El Juego</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #ffb7d5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .game-container {
            width: 100%; max-width: 430px; height: 92vh; border-radius: 40px;
            border: 8px solid #fff; position: relative; overflow: hidden; background: #fff0f5;
        }

        .screen { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* BARRA LATERAL */
        .sidebar {
            position: absolute; left: 10px; top: 100px; z-index: 50;
            display: flex; flex-direction: column; gap: 15px;
        }
        .nav-btn {
            width: 60px; height: 60px; background: white; border-radius: 15px;
            border: 4px solid #ff3385; cursor: pointer; display: flex;
            justify-content: center; align-items: center; font-size: 24px;
            box-shadow: 0 4px 0 #ff3385; transition: 0.2s;
        }

        /* ANIMACIÓN DEL BEBÉ */
        .baby-container {
            margin-top: auto; margin-bottom: 50px;
            animation: babyMove 3s infinite ease-in-out;
        }
        @keyframes babyMove {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-10px); }
        }
        .baby-img { width: 180px; height: auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }

        /* FONDOS */
        #room-bedroom { background: url('cuarto_varon.jpg') center/cover; }
        #room-kitchen { background: #fffaf0; }
        #room-bathroom { background: #e0ffff; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="room-bedroom" class="screen active">
            <div class="sidebar">
                <div class="nav-btn" onclick="showRoom('bedroom')">🏠</div>
                <div class="nav-btn" onclick="showRoom('kitchen')">🍎</div>
                <div class="nav-btn" onclick="showRoom('bathroom')">🛁</div>
            </div>
            <div class="baby-container">
                <img src="bebe_varon.png" class="baby-img">
            </div>
        </div>

        <div id="room-kitchen" class="screen">
            <div class="sidebar">
                <div class="nav-btn" onclick="showRoom('bedroom')">🏠</div>
                <div class="nav-btn" onclick="showRoom('kitchen')">🍎</div>
                <div class="nav-btn" onclick="showRoom('bathroom')">🛁</div>
            </div>
            <h2 style="margin-top: 100px;">Cocina 🍎</h2>
        </div>

        <div id="room-bathroom" class="screen">
            <div class="sidebar">
                <div class="nav-btn" onclick="showRoom('bedroom')">🏠</div>
                <div class="nav-btn" onclick="showRoom('kitchen')">🍎</div>
                <div class="nav-btn" onclick="showRoom('bathroom')">🛁</div>
            </div>
            <h2 style="margin-top: 100px;">Baño 🛁</h2>
        </div>
    </div>

    <script>
        function showRoom(roomName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('room-' + roomName).classList.add('active');
        }
    </script>
</body>
</html>
