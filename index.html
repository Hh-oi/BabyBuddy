<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyBuddy - El Juego</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: #ffb7d5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal estilo celular */
        .game-container {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 850px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 8px solid #fff;
            position: relative;
            overflow: hidden;
            background: #fff0f5;
        }

        /* PANTALLAS (Por defecto ocultas, controladas por JS) */
        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. PANTALLA DE INICIO --- */
        #start-screen {
            background: linear-gradient(180deg, #ffd6e4 0%, #ffb7d5 100%);
            justify-content: center;
            gap: 40px;
        }

        .game-title {
            font-size: 42px;
            color: #ffffff;
            text-shadow: 0 4px 8px rgba(214, 51, 132, 0.5), 0 -2px 0 #d63384;
            text-align: center;
            animation: bounce 2s infinite ease-in-out;
        }

        /* --- 2. PANTALLA DE SELECCIÓN --- */
        #selection-screen {
            background: linear-gradient(180deg, #fff0f5 0%, #ffd6e4 100%);
            justify-content: center;
            gap: 30px;
        }

        .select-title {
            font-size: 24px;
            color: #d63384;
            text-align: center;
            margin-bottom: 10px;
        }

        .selection-box {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .select-card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 0 #f0d5de;
            border: 3px solid #ffffff;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            width: 140px;
        }

        .select-card:hover {
            transform: scale(1.08);
        }

        .select-card img {
            width: 100px;
            height: 110px;
            object-fit: contain;
        }

        .select-name {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        /* --- 3. JUEGO PRINCIPAL (HABITACIÓN) --- */
        #game-screen {
            background: 
                linear-gradient(to top, #f3d1b5 0%, #e1b491 25%, transparent 25%),
                linear-gradient(to top, #ffffff 25%, #ffffff 26%, transparent 26%),
                linear-gradient(90deg, #ffecf2 50%, #ffd6e4 50%);
            background-size: 100% 100%, 100% 100%, 40px 100%;
        }

        /* Ventana de fondo */
        #game-screen::before {
            content: '';
            position: absolute;
            top: 110px;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            border: 6px solid #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.6);
            z-index: 1;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 6px 0 #d4b2bc;
            font-size: 22px;
            font-weight: bold;
            color: #d63384;
            z-index: 10;
        }

        .status-box {
            width: 85%;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 6px 0 #debcc5;
            z-index: 10;
        }

        .status-label {
            font-size: 12px;
            color: #ff3385;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            background: #eee;
            height: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3385, #ff85b3);
            transition: width 0.3s ease;
        }

        /* Bebé principal en escena */
        .main-baby-avatar {
            height: 240px;
            object-fit: contain;
            margin-top: auto;
            margin-bottom: 10px;
            z-index: 5;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
            animation: idle 3s infinite ease-in-out;
        }

        /* --- BOTONES Y ELEMENTOS UI --- */
        .btn-ui {
            background: linear-gradient(180deg, #ff66a3 0%, #ff3385 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b30047, 0 10px 20px rgba(255, 51, 133, 0.3);
            transition: all 0.1s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .btn-ui:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b30047, 0 5px 10px rgba(255, 51, 133, 0.3);
        }

        /* Animaciones tiernas */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes idle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="start-screen" class="screen active">
            <h1 class="game-title">BabyBuddy ✨</h1>
            <button class="btn-ui" onclick="goToSelection()">JUGAR</button>
        </div>

        <div id="selection-screen" class="screen">
            <h2 class="select-title">¿A quién querés cuidar hoy?</h2>
            <div class="selection-box">
                <div class="select-card" onclick="startGame('varon')">
                    <img src="bebe_varon.jpeg" alt="Varón" onerror="this.src='https://placehold.co/100x110/ffccd5/fff?text=Varon'">
                    <div class="select-name">Bebé Varón</div>
                </div>
                <div class="select-card" onclick="startGame('nena')">
                    <img src="bebe_nena.jpeg" alt="Nena" onerror="this.src='https://placehold.co/100x110/ffccd5/fff?text=Nena'">
                    <div class="select-name">Bebé Nena</div>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="stats-panel">
                🪙 <span id="coin-txt">Monedas: 0</span>
            </div>

            <div class="status-box">
                <div class="status-label">🍼 NIVEL DE SACIEDAD</div>
                <div class="bar-container">
                    <div id="hunger-bar" class="bar-fill"></div>
                </div>
            </div>

            <img id="active-baby-img" class="main-baby-avatar" src="" alt="Baby">

            <button class="btn-ui" onclick="feedBaby()">DAR BIBERÓN</button>
        </div>

    </div>

    <script>
        let coins = 0;
        let hunger = 100;
        let selectedBaby = '';

        // Cambiar de Inicio a Selección
        function goToSelection() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('selection-screen').classList.add('active');
        }

        // Iniciar el juego con el bebé elegido
        function startGame(gender) {
            selectedBaby = gender;
            const babyImgNode = document.getElementById('active-baby-img');
            
            if(gender === 'varon') {
                babyImgNode.src = 'bebe_varon.jpeg';
            } else {
                babyImgNode.src = 'bebe_nena.jpeg';
            }

            document.getElementById('selection-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            // Iniciar ciclo de hambre pasiva
            startHungerTimer();
        }

        // Lógica de juego
        function startHungerTimer() {
            setInterval(() => {
                if (hunger > 0) {
                    hunger -= 0.5;
                    document.getElementById('hunger-bar').style.width = hunger + '%';
                }
            }, 250);
        }

        function feedBaby() {
            hunger = 100;
            coins += 10;
            document.getElementById('hunger-bar').style.width = hunger + '%';
            document.getElementById('coin-txt').innerText = "Monedas: " + coins;
        }
    </script>
</body>
</html>
