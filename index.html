<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyBuddy - El Juego</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background-color: #ffb7d5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal estilo celular */
        .game-container {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 850px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 8px solid #fff;
            position: relative;
            overflow: hidden;
            background: #fff0f5;
        }

        /* PANTALLAS */
        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. PANTALLA DE INICIO --- */
        #start-screen {
            background: linear-gradient(180deg, #ffd6e4 0%, #ffb7d5 100%);
            justify-content: center;
            gap: 40px;
        }

        .game-title {
            font-size: 42px;
            color: #ffffff;
            text-shadow: 0 4px 8px rgba(214, 51, 132, 0.5), 0 -2px 0 #d63384;
            text-align: center;
            animation: bounce 2s infinite ease-in-out;
        }

        /* --- 2. PANTALLA DE SELECCIÓN --- */
        #selection-screen {
            background: linear-gradient(180deg, #fff0f5 0%, #ffd6e4 100%);
            justify-content: center;
            gap: 30px;
        }

        .select-title {
            font-size: 24px;
            color: #d63384;
            text-align: center;
            margin-bottom: 10px;
        }

        .selection-box {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .select-card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 0 #f0d5de;
            border: 3px solid #ffffff;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            width: 140px;
        }

        .select-card:hover {
            transform: scale(1.08);
        }

        .select-card img {
            width: 100px;
            height: 110px;
            object-fit: contain;
        }

        .select-name {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        /* --- 3. JUEGO PRINCIPAL (HABITACIÓN) --- */
        #game-screen {
            background: 
                linear-gradient(to top, #f3d1b5 0%, #e1b491 25%, transparent 25%),
                linear-gradient(to top, #ffffff 25%, #ffffff 26%, transparent 26%),
                linear-gradient(90deg, #ffecf2 50%, #ffd6e4 50%);
            background-size: 100% 100%, 100% 100%, 40px 100%;
        }

        /* Ventana de fondo */
        #game-screen::before, #closet-screen::before {
            content: '';
            position: absolute;
            top: 110px;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            border: 6px solid #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.6);
            z-index: 1;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 6px 0 #d4b2bc;
            font-size: 22px;
            font-weight: bold;
            color: #d63384;
            z-index: 10;
        }

        .status-box {
            width: 85%;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 6px 0 #debcc5;
            z-index: 10;
        }

        .status-label {
            font-size: 12px;
            color: #ff3385;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            background: #eee;
            height: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3385, #ff85b3);
            transition: width 0.3s ease;
        }

        /* Contenedor del Avatar y su Ropita superpuesta */
        .avatar-container {
            position: relative;
            height: 240px;
            width: 200px;
            margin-top: auto;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
            animation: idle 3s infinite ease-in-out;
        }

        .main-baby-avatar {
            height: 100%;
            width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        /* Capa de ropa superpuesta al bebé */
        .clothes-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 6;
            pointer-events: none; /* No interfiere con los clics */
            display: none;
        }

        /* Contenedor de botones de acción inferiores */
        .action-row {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            z-index: 10;
        }

        /* --- 4. PANTALLA DE VESTIDOR --- */
        #closet-screen {
            background: 
                linear-gradient(to top, #f3d1b5 0%, #e1b491 25%, transparent 25%),
                linear-gradient(to top, #ffffff 25%, #ffffff 26%, transparent 26%),
                linear-gradient(90deg, #ffecf2 50%, #ffd6e4 50%);
            background-size: 100% 100%, 100% 100%, 40px 100%;
        }

        .closet-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 8px 0 #debcc5;
            z-index: 10;
            margin-bottom: 10px;
        }

        .closet-title {
            font-size: 18px;
            color: #ff3385;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* Grilla de ropas */
        .clothes-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            overflow-x: auto;
            padding: 5px;
        }

        .clothing-item {
            width: 75px;
            height: 75px;
            background: #fff;
            border: 3px solid #ffd6e4;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #ffd6e4;
            font-size: 28px; /* Emoji temporal mientras cargas tus Overlays */
            transition: all 0.1s ease;
        }

        .clothing-item:hover {
            transform: scale(1.05);
            border-color: #ff3385;
        }

        /* --- BOTONES Y ELEMENTOS UI --- */
        .btn-ui {
            background: linear-gradient(180deg, #ff66a3 0%, #ff3385 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b30047, 0 10px 20px rgba(255, 51, 133, 0.3);
            transition: all 0.1s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .btn-ui:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b30047, 0 5px 10px rgba(255, 51, 133, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #b983ff 0%, #944dff 100%);
            box-shadow: 0 8px 0 #5900b3, 0 10px 20px rgba(148, 77, 255, 0.3);
        }
        .btn-secondary:active {
            box-shadow: 0 4px 0 #5900b3;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes idle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="start-screen" class="screen active">
            <h1 class="game-title">BabyBuddy ✨</h1>
            <button class="btn-ui" onclick="goToSelection()">JUGAR</button>
        </div>

        <div id="selection-screen" class="screen">
            <h2 class="select-title">¿A quién querés cuidar hoy?</h2>
            <div class="selection-box">
                <div class="select-card" onclick="startGame('varon')">
                    <img src="bebe_varon.png" alt="Varón" onerror="this.src='https://placehold.co/100x110/ffccd5/fff?text=Varon'">
                    <div class="select-name">Bebé Varón</div>
                </div>
                <div class="select-card" onclick="startGame('nena')">
                    <img src="bebe_nena.png" alt="Nena" onerror="this.src='https://placehold.co/100x110/ffccd5/fff?text=Nena'">
                    <div class="select-name">Bebé Nena</div>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="stats-panel">
                🪙 <span id="coin-txt">Monedas: 0</span>
            </div>

            <div class="status-box">
                <div class="status-label">🍼 NIVEL DE SACIEDAD</div>
                <div class="bar-container">
                    <div id="hunger-bar" class="bar-fill"></div>
                </div>
            </div>

            <div class="avatar-container">
                <img id="active-baby-img" class="main-baby-avatar" src="" alt="Baby">
                <img id="baby-clothes-overlay" class="clothes-overlay" src="" alt="Ropa">
            </div>

            <div class="action-row">
                <button class="btn-ui" onclick="feedBaby()">🍼 ALIMENTAR</button>
                <button class="btn-ui btn-secondary" onclick="openCloset()">👕 VESTIDOR</button>
            </div>
        </div>

        <div id="closet-screen" class="screen">
            <div class="stats-panel">👗 Vestidor</div>

            <div class="avatar-container" style="margin-top: 20px;">
                <img id="closet-baby-img" class="main-baby-avatar" src="" alt="Baby">
                <img id="closet-clothes-overlay" class="clothes-overlay" src="" alt="Ropa">
            </div>

            <div class="closet-panel">
                <div class="closet-title" id="closet-owner-title">Ropita</div>
                <div class="clothes-grid" id="clothes-options-container">
                    </div>
            </div>

            <button class="btn-ui" onclick="closeCloset()">GUARDAR Y VOLVER</button>
        </div>

    </div>

    <script>
        let coins = 0;
        let hunger = 100;
        let selectedBaby = '';
        let currentOutfit = ''; // Almacena la ruta de la ropa actual

        // Configuración de ropa (Podés cambiar los nombres por tus propios archivos .png transparentes si los creás)
        const outfits = {
            varon: [
                { id: 'original', icon: '❌', src: '' },
                { id: 'gorrito', icon: '👑', src: 'ropa_varon_1.png' }, // Nombre de ejemplo para tus prendas transparentes
                { id: 'buzo', icon: '🦖', src: 'ropa_varon_2.png' }
            ],
            nena: [
                { id: 'original', icon: '❌', src: '' },
                { id: 'vestido', icon: '🎀', src: 'ropa_nena_1.png' },
                { id: 'pijama', icon: '🦄', src: 'ropa_nena_2.png' }
            ]
        };

        function goToSelection() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('selection-screen').classList.add('active');
        }

        function startGame(gender) {
            selectedBaby = gender;
            currentOutfit = ''; // Empieza con su ropa original por defecto
            
            updateAvatarsAndClothes();

            document.getElementById('selection-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            startHungerTimer();
        }

        // Mantiene sincronizados los bebés y sus ropas en todas las pantallas
        function updateAvatarsAndClothes() {
            const babyFile = selectedBaby === 'varon' ? 'bebe_varon.png' : 'bebe_nena.png';
            
            document.getElementById('active-baby-img').src = babyFile;
            document.getElementById('closet-baby-img').src = babyFile;

            const roomOverlay = document.getElementById('baby-clothes-overlay');
            const closetOverlay = document.getElementById('closet-clothes-overlay');

            if (currentOutfit) {
                roomOverlay.src = currentOutfit;
                roomOverlay.style.display = 'block';
                closetOverlay.src = currentOutfit;
                closetOverlay.style.display = 'block';
            } else {
                roomOverlay.style.display = 'none';
                closetOverlay.style.display = 'none';
            }
        }

        // Ir al vestidor
        function openCloset() {
            document.getElementById('closet-owner-title').innerText = "Armario de: Bebé " + selectedBaby;
            
            // Renderizar los botones de ropa según el género elegido
            const container = document.getElementById('clothes-options-container');
            container.innerHTML = ''; // Limpiar anteriores

            outfits[selectedBaby].forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'clothing-item';
                itemDiv.innerText = item.icon;
                itemDiv.onclick = () => changeOutfit(item.src);
                container.appendChild(itemDiv);
            });

            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('closet-screen').classList.add('active');
        }

        function changeOutfit(imgSrc) {
            currentOutfit = imgSrc;
            updateAvatarsAndClothes();
        }

        function closeCloset() {
            document.getElementById('closet-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }

        // Mecánicas básicas
        function startHungerTimer() {
            setInterval(() => {
                if (hunger > 0) {
                    hunger -= 0.5;
                    document.getElementById('hunger-bar').style.width = hunger + '%';
                }
            }, 250);
        }

        function feedBaby() {
            hunger = 100;
            coins += 10;
            document.getElementById('hunger-bar').style.width = hunger + '%';
            document.getElementById('coin-txt').innerText = "Monedas: " + coins;
        }
    </script>
</body>
</html>
